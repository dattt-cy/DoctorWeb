spring.application.name=DoctorBackend
spring.config.import=optional:file:.env.properties

# =============================================
# DATABASE - khớp với docker-compose.yml
# =============================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA / HIBERNATE
# =============================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

# Không để biến DEBUG chung của hệ điều hành bật log request body hoặc SQL nhạy cảm.
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO

# =============================================
# FLYWAY (tự tạo bảng qua migration)
# =============================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# =============================================
# SERVER
# =============================================
server.port=${PORT:8080}

# =============================================
# JWT & CORS
# =============================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Lax}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}
app.rate-limit.login.max-attempts=${LOGIN_RATE_LIMIT:5}
app.rate-limit.login.window-seconds=${LOGIN_RATE_WINDOW_SECONDS:300}
app.rate-limit.booking.max-attempts=${BOOKING_RATE_LIMIT:10}
app.rate-limit.booking.window-seconds=${BOOKING_RATE_WINDOW_SECONDS:600}

spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:5MB}

# =============================================
# ACTUATOR
# =============================================
management.endpoints.web.exposure.include=health,info

# =============================================
# CLOUDINARY
# =============================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
